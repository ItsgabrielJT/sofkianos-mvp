# Test-specific configuration — H2 in-memory database
# Overrides main application.properties for Spring context tests

spring.application.name=producer-api
server.port=8082

# RabbitMQ (same as main config — needed by RabbitConfig beans)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
app.rabbitmq.exchange=kudos.exchange
app.rabbitmq.queue=kudos.queue
app.rabbitmq.routing-key=kudos.key

# Swagger
springdoc.swagger-ui.path=/swagger-ui
spring.web.resources.add-mappings=false

# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
